name: daily-market

on:
  schedule:
    # GitHub cron 用 UTC：北京时间 16:10 / 16:40 / 17:10 / 17:40 各跑一次
    # 多设几个点防止被 GitHub 调度器延迟或丢弃；脚本按交易日去重，多跑不会产生重复数据
    - cron: "10 8 * * 1-5"
    - cron: "40 8 * * 1-5"
    - cron: "10 9 * * 1-5"
    - cron: "40 9 * * 1-5"
    # 午间（北京时间 12:20 / 12:50）
    - cron: "20 4 * * 1-5"
    - cron: "50 4 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-market
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取数据并生成网页
        run: |
          H=$(TZ=Asia/Shanghai date +%H)
          if [ "$H" -lt 15 ]; then
            echo "北京时间 ${H} 点 -> 午间快照"
            python daily.py --midday
          else
            echo "北京时间 ${H} 点 -> 全天收盘"
            python daily.py --close
          fi
          python site_gen.py

      - name: 提交更新
        run: |
          git config user.name  "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "update $(TZ=Asia/Shanghai date +%F) close"
          for i in 1 2 3 4 5; do
            echo "push attempt $i"
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed"
              exit 0
            fi
            sleep 8
          done
          echo "push failed after retries"
          exit 1
